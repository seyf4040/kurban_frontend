name: kurban_management
description: A Flutter app for managing Kurban sacrifices and participations
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  
  # HTTP & Networking
  dio: ^5.3.2
  pretty_dio_logger: ^1.3.1
  
  # UI & Animations
  cupertino_icons: ^1.0.2
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  
  # Data & Storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.18.1
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/